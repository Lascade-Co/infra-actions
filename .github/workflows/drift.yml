# Daily drift report, read-only: droplets with no file, hand-made changes, the GitHub token's
# expiry. The tool sends the summary to Telegram; the log shows counts and pass/fail only.
# Until infra's main has an account.yaml (it arrives at the switch-over, phase E) the run ends
# early with a success and a one-line note.
name: drift

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC, 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: "seal-bash-e {0}"

concurrency:
  group: infra-drift
  cancel-in-progress: false

jobs:
  drift:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@ef8adb13b1e2cc83d812fbe993ee5fc6f0b17744 # seal-v1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch infra's main
        id: head
        env:
          INFRA_GH_TOKEN: ${{ secrets.INFRA_GH_TOKEN }}
        run: |
          .github/scripts/fetch-infra.sh "$RUNNER_TEMP/infra-head" refs/heads/main
          echo "sha=$(git -C "$RUNNER_TEMP/infra-head" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/infra-head/account.yaml" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra's main has no account.yaml yet (it arrives at the switch-over): drift skipped."
          fi

      # No API tokens here; only the Telegram bot token, for the load-failure alert (counts and
      # error codes, no names).
      - name: Validate (no API calls; Telegram alert on failure)
        if: steps.head.outputs.ready == 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Fallback chat for the alert when account.yaml itself can't be read. A secret, not a
          # variable: GitHub prints a step's env in the public log and masks only secrets.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          rc=0
          node dist/cli.js validate "$RUNNER_TEMP/infra-head" --notify drift --commit "$SHA" --out "$RUNNER_TEMP/infra-validate.md" || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::error::The infra checkout does not load or fails the schema. Drift not run: no API was called."
            exit 1
          fi

      - name: Drift
        if: steps.head.outputs.ready == 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          INFRA_GH_TOKEN: ${{ secrets.INFRA_GH_TOKEN }}
          ONEUPTIME_API_KEY: ${{ secrets.ONEUPTIME_API_KEY }}
          ONEUP_ACCESS_CLIENT_ID: ${{ secrets.ONEUP_ACCESS_CLIENT_ID }}
          ONEUP_ACCESS_CLIENT_SECRET: ${{ secrets.ONEUP_ACCESS_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node dist/cli.js drift "$RUNNER_TEMP/infra-head" --commit "$SHA" --out "$RUNNER_TEMP/infra-report.md"

      - name: Remove the checkout and the reports
        if: always()
        run: rm -rf "$RUNNER_TEMP/infra-head" "$RUNNER_TEMP/infra-report.md" "$RUNNER_TEMP/infra-validate.md"

      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@ef8adb13b1e2cc83d812fbe993ee5fc6f0b17744 # seal-v1
